name: Frontend CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: npm
            - run: npm ci
            - name: Typecheck, lint, format
              run: npm run check
            - name: Build
              run: npm run build
